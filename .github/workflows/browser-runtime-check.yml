name: Browser runtime checks
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve the static game
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/game-server.log 2>&1 &
          echo $! > /tmp/game-server.pid
      - name: Test 2D and 3D pages in Chromium
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true, args: ['--use-gl=angle', '--use-angle=swiftshader', '--enable-webgl', '--ignore-gpu-blocklist'] });
            const page = await browser.newPage({ viewport: { width: 1280, height: 800 } });
            const errors = [];
            page.on('pageerror', error => errors.push(error.message));
            await page.goto('http://127.0.0.1:8000/index.html', { waitUntil: 'domcontentloaded' });
            await page.waitForSelector('#game');
            await page.locator('#start').click();
            await page.waitForTimeout(300);
            if (await page.locator('#message').isVisible()) throw new Error('2D start overlay did not close');
            await page.goto('http://127.0.0.1:8000/3d.html', { waitUntil: 'domcontentloaded' });
            await page.waitForSelector('canvas');
            await page.waitForTimeout(1500);
            if (!(await page.locator('#score').count())) throw new Error('3D score HUD is missing');
            if (errors.length) throw new Error(errors.join('\n'));
            await browser.close();
            console.log('Passed: 2D start flow and 3D page initialization.');
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
