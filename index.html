<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roblox-1o1-Sim</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="hud">
      <div class="top-bar">
        <div class="chip">Roblox-1o1-Sim</div>
        <div class="chip">Score: <span id="score">0</span></div>
        <div class="chip">Gems: <span id="gems">0</span></div>
      </div>

      <div id="message">
        Click to start • WASD to move • Space to jump • Mouse to look
      </div>

      <div id="crosshair" aria-hidden="true">
        <span></span>
      </div>
    </div>

    <script type="module" src="./game.js"></script>
  </body>
</html>
